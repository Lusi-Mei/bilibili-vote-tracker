name: Vote Tracker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tracker (6h session)
        env:
          HISTORY_INTERVAL: "720"
          MAX_HISTORY_POINTS: "336"
        run: python3 vote_tracker.py --server
